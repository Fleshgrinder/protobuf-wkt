name: sync

on:
  push:
    branches:
    - main
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ github.token }}
    - name: sync
      run: ./sync
      env:
        GITHUB_TOKEN: ${{ github.token }}
